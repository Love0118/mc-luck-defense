name: Build and test
on:
  push:
    branches: [beta, main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B -ntp clean verify
      - run: java -cp target/classes dev.moma.sim.SimulatorMain 4 123 1 target/simulation-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: moma-defense
          path: target/moma-defense-*.jar
