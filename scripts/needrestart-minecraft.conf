# Only the root-owned, empty-server maintenance window permits automatic restarts.
# Outside that window, needrestart still reports these services as deferred.
my $minecraft_restart = -f q(/run/minecraft-idle-upgrade/allow-restarts) ? 1 : 0;
$nrconf{override_rc}->{qr(^mc-luck-defense\.service$)} = $minecraft_restart;
$nrconf{override_rc}->{qr(^steve-td\.service$)} = $minecraft_restart;
$nrconf{override_rc}->{qr(^steve-td-proxy\.service$)} = $minecraft_restart;
